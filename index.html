<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"></head><body><title>금강과학부 계비 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ground: #F2F4F1;
    --surface: #FFFFFF;
    --surface-2: #F7F9F6;
    --ink: #19241F;
    --ink-2: #3B4842;
    --muted: #64726B;
    --line: #DCE3DD;
    --accent: #1E6A5A;
    --accent-ink: #FFFFFF;
    --accent-soft: #E3EFEA;
    --over: #BE3A2B;
    --over-soft: #FBE6E2;
    --due: #8F6310;
    --due-soft: #FAF0DA;
    --future: #E8ECE8;
    --future-ink: #55615A;
    --cat-1: #1E6A5A;
    --cat-2: #7FA99B;
    --cat-3: #BC8A2E;
    --cat-4: #5B7C99;
    --cat-5: #8A7BA6;
    --cat-6: #9AA59F;
    --shadow: 0 1px 2px rgba(20, 40, 34, .05), 0 10px 30px rgba(20, 40, 34, .07);
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --display: "Hahmlet", "Apple SD Gothic Neo", "Malgun Gothic", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0F1513;
      --surface: #171F1C;
      --surface-2: #1C2622;
      --ink: #E5EBE7;
      --ink-2: #C3CDC8;
      --muted: #93A099;
      --line: #2A3531;
      --accent: #55B79D;
      --accent-ink: #0C1311;
      --accent-soft: #1C332D;
      --over: #F0806C;
      --over-soft: #38201C;
      --due: #E0AC58;
      --due-soft: #332918;
      --future: #232E2A;
      --future-ink: #98A59E;
      --cat-1: #55B79D;
      --cat-2: #2F6B5C;
      --cat-3: #D2A24B;
      --cat-4: #7C9DB8;
      --cat-5: #A294BE;
      --cat-6: #6C7A74;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0F1513;
    --surface: #171F1C;
    --surface-2: #1C2622;
    --ink: #E5EBE7;
    --ink-2: #C3CDC8;
    --muted: #93A099;
    --line: #2A3531;
    --accent: #55B79D;
    --accent-ink: #0C1311;
    --accent-soft: #1C332D;
    --over: #F0806C;
    --over-soft: #38201C;
    --due: #E0AC58;
    --due-soft: #332918;
    --future: #232E2A;
    --future-ink: #98A59E;
    --cat-1: #55B79D;
    --cat-2: #2F6B5C;
    --cat-3: #D2A24B;
    --cat-4: #7C9DB8;
    --cat-5: #A294BE;
    --cat-6: #6C7A74;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }

  [hidden] { display: none !important; }   /* .lock/.years의 display가 hidden을 덮지 않도록 */

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 40px; }
  h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; }
  b, strong { font-weight: 600; }
  .num { font-variant-numeric: tabular-nums; }

  /* 머리글 */
  .eyebrow { margin: 0; font-size: 13px; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
  h1 { font-size: 26px; margin-top: 2px; letter-spacing: -.01em; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

  .years { display: flex; gap: 6px; margin-top: 14px; }
  .years button { font: inherit; font-size: 14.5px; font-weight: 600; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 15px; cursor: pointer; }
  .years button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .years button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lock { margin-top: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 18px; box-shadow: var(--shadow); display: grid; gap: 10px; }
  .lock-title { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 700; }
  .lock-sub { margin: 0 0 4px; color: var(--muted); font-size: 14px; }
  .lock-input { font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); color: var(--ink); }
  .lock-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lock-remember { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 14px; }
  .lock-btn { font: inherit; font-size: 16px; font-weight: 600; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 11px; padding: 12px; cursor: pointer; }
  .lock-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lock-error { margin: 0; color: var(--over); font-size: 14px; }
  section { margin-top: 26px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  h2 { font-size: 19px; }
  .sec-sum { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .cards { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .cards > * + * { border-top: 1px solid var(--line); }
  .note { margin: 10px 2px 0; color: var(--muted); font-size: 13.5px; }

  /* 잔액 */
  .fund { background: var(--surface); border-radius: 18px; padding: 20px 18px 16px; box-shadow: var(--shadow); margin-top: 18px; }
  .fund-label { margin: 0; color: var(--muted); font-size: 14px; }
  .fund-big { margin: 2px 0 0; font-family: var(--display); font-size: 40px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .fund-big i { font-style: normal; font-size: 20px; font-family: var(--sans); font-weight: 600; margin-left: 3px; }
  .fund-sub { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
  .flow { margin: 16px 0 0; padding: 14px 0 0; border-top: 1px solid var(--line); display: grid; gap: 7px; }
  .flow > div { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; color: var(--ink-2); }
  .flow dt { margin: 0; }
  .flow dd { margin: 0; font-variant-numeric: tabular-nums; }
  .flow .flow-total { margin-top: 5px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--ink); font-weight: 600; font-size: 15.5px; }
  .warn { margin: 12px 0 0; padding: 10px 12px; background: var(--due-soft); color: var(--due); border-radius: 10px; font-size: 13.5px; }

  /* 미납 */
  .u-row { display: flex; align-items: flex-start; gap: 10px; padding: 13px 15px; }
  .u-main { flex: 1; min-width: 0; }
  .u-name { font-weight: 600; font-size: 16.5px; }
  .u-detail { color: var(--ink-2); font-size: 14px; margin-top: 1px; }
  .u-ev { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .u-amt { color: var(--over); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .allclear { padding: 16px 15px; color: var(--accent); font-weight: 600; }

  /* 칩 · 알약 */
  .chip { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; vertical-align: 2px; }
  .chip-mute { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .pill { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .p-ok { background: var(--accent-soft); color: var(--accent); }
  .p-due { background: var(--due-soft); color: var(--due); }
  .p-over { background: var(--over-soft); color: var(--over); }

  /* 회원별 */
  .picker { display: flex; align-items: center; gap: 8px; margin: 0 2px 10px; font-size: 14px; color: var(--muted); }
  .picker select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 5px 9px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin: 0 2px 10px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 13px; height: 13px; border-radius: 4px; border: 1.5px solid transparent; }
  .sw-paid { background: var(--accent); }
  .sw-over { background: var(--over-soft); border-color: var(--over); }
  .sw-due { background: var(--due-soft); border-color: var(--due); border-style: dashed; }
  .sw-up { background: var(--future); }

  .m { background: var(--surface); }
  .m > summary { list-style: none; cursor: pointer; padding: 13px 15px; }
  .m > summary::-webkit-details-marker { display: none; }
  .m > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .m-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .m-name { font-size: 17px; font-weight: 600; }
  .m-top .pill { margin-left: auto; }
  .chev { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: -4px 3px 0 4px; transition: transform .15s ease; }
  .m[open] .chev { transform: rotate(225deg); margin-top: 2px; }
  .m-amt { display: flex; gap: 14px; margin-top: 9px; font-size: 13.5px; color: var(--muted); }
  .m-amt b { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .m-amt .owe b { color: var(--over); }
  .mine { box-shadow: inset 3px 0 0 var(--accent); }

  .strip { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin-top: 10px; }
  .cell { aspect-ratio: 1; display: grid; place-items: center; border-radius: 6px; border: 1.5px solid transparent; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .c-paid { background: var(--accent); color: var(--accent-ink); }
  .c-overdue { background: var(--over-soft); color: var(--over); border-color: var(--over); }
  .c-due { background: var(--due-soft); color: var(--due); border-color: var(--due); border-style: dashed; }
  .c-upcoming { background: var(--future); color: var(--future-ink); }
  .strip-sm .cell { font-size: 10px; border-radius: 5px; }

  .m-detail { padding: 2px 15px 15px; border-top: 1px dashed var(--line); margin-top: 2px; }
  .md-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 14px; margin: 12px 0 0; font-size: 14px; }
  .md-grid div { display: flex; gap: 7px; align-items: baseline; }
  .md-grid dt { margin: 0; color: var(--muted); width: 2.6em; flex: none; }
  .md-grid dd { margin: 0; font-variant-numeric: tabular-nums; }
  .md-late { color: var(--muted); font-size: 12.5px; }
  .md-over { color: var(--over); }
  .md-due { color: var(--due); }
  .md-up { color: var(--future-ink); }
  .md-note { margin: 12px 0 0; font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 9px 11px; }
  .md-note .ev { color: var(--muted); }
  .md-sub { margin: 14px 0 0; font-size: 13px; color: var(--muted); }

  /* 지출 */
  .bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--future); margin-bottom: 9px; }
  .bar i { display: block; height: 100%; }
  .bar-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 2px 12px; font-size: 13px; color: var(--muted); }
  .bar-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 3px; }
  .e-row { display: flex; align-items: baseline; gap: 10px; padding: 12px 15px; }
  .e-date { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; width: 3.4em; flex: none; }
  .e-title { flex: 1; min-width: 0; }
  .e-title small { color: var(--muted); font-size: 12.5px; margin-left: 5px; }
  .e-amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  details.e > summary { list-style: none; cursor: pointer; }
  details.e > summary::-webkit-details-marker { display: none; }
  details.e > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .e-items { padding: 0 15px 12px 15px; }
  .e-item { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--ink-2); padding: 3px 0 3px 3.4em; }
  .e-item span { font-variant-numeric: tabular-nums; }
  .e-total { display: flex; justify-content: space-between; padding: 12px 15px; background: var(--surface-2); font-weight: 600; }
  .e-total span { font-variant-numeric: tabular-nums; }
  .e-total small { color: var(--muted); font-weight: 400; font-size: 12.5px; margin-left: 5px; }

  /* 정산 */
  .set-label { margin: 16px 2px 7px; font-size: 13.5px; color: var(--muted); font-weight: 600; }
  .set-label:first-of-type { margin-top: 4px; }
  .set-row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 15px; font-size: 15px; }
  .set-total { background: var(--surface-2); font-weight: 600; }
  .set-ok { color: var(--accent); font-weight: 600; }
  .set-due { color: var(--due); font-weight: 600; }
  .set-owe { color: var(--over); font-weight: 600; }

  /* 맨 아래 */
  .foot { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 16px; color: var(--muted); font-size: 13.5px; }
  .foot p { margin: 0 0 6px; }
  .copy { font: inherit; font-size: 14.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 11px; padding: 11px 16px; width: 100%; cursor: pointer; margin: 6px 0 14px; }
  .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .changes { margin: 0 0 14px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 13.5px; color: var(--ink-2); }
  .changes p { margin: 0 0 4px; color: var(--muted); font-size: 12.5px; }
  .changes li { margin-left: 16px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <h1>계비 현황</h1>
    <p class="sub" id="sub"></p>
  </header>
  <nav class="years" id="years" aria-label="연도 선택" hidden></nav>
  <main id="app"></main>
  <form class="lock" id="lock" hidden>
    <p class="lock-title">모임 비밀번호를 넣어 주세요</p>
    <p class="lock-sub">금강과학부 계원만 보는 내용이에요. 단톡방에 올린 비밀번호를 넣으면 돼요.</p>
    <input class="lock-input" id="pw" type="password" autocomplete="current-password" inputmode="text" placeholder="비밀번호" aria-label="모임 비밀번호">
    <label class="lock-remember"><input type="checkbox" id="remember" checked> 이 기기에서 기억하기 (공용 PC면 꺼 주세요)</label>
    <button class="lock-btn" id="unlock" type="submit">열기</button>
    <p class="lock-error" id="lockerr" hidden></p>
  </form>

<script>
  (function () {
    var RAW = JSON.parse(document.getElementById('gye-data').textContent), D = RAW;
    var CAT_COLORS = { '모임 지원': 'var(--cat-1)', '상조회비': 'var(--cat-2)', '경조사': 'var(--cat-3)', '선물': 'var(--cat-4)', '지급(환급)': 'var(--cat-5)', '기타': 'var(--cat-6)' };
    var byYear = {}, curYear = null;

    function won(n) { return n.toLocaleString('ko-KR'); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function ymd(iso) { var p = iso.split('-').map(Number); return { y: p[0], m: p[1], d: p[2] }; }
    function md(iso) { var t = ymd(iso); return (t.y !== curYear ? t.y + '.' : '') + t.m + '/' + t.d; }
    function ranges(ms) {
      var out = [], s = null, p = null;
      ms.slice().sort(function (a, b) { return a - b; }).forEach(function (m) {
        if (s === null) { s = p = m; return; }
        if (m === p + 1) { p = m; return; }
        out.push(s === p ? String(s) : s + '~' + p); s = p = m;
      });
      if (s !== null) out.push(s === p ? String(s) : s + '~' + p);
      return out.join('·') + '월';
    }
    function strip(months, small) {
      return '<div class="strip' + (small ? ' strip-sm' : '') + '">' + months.map(function (x) {
        var label = { paid: '납부', overdue: '미납', due: '이번 달', upcoming: '아직' }[x.status];
        return '<span class="cell c-' + x.status + '" aria-label="' + x.m + '월 ' + label +
          (x.date ? ' ' + md(x.date) : '') + '">' + x.m + '</span>';
      }).join('') + '</div>';
    }

    /* ---------- 잔액 ---------- */
    function fundHtml(Y) {
      var f = Y.fund, t = ymd(Y.bank.lastTxn);
      var rows = [
        [f.openingLabel, f.opening],
        [f.duesLabel, f.dues],
        ['+ 예금 이자', f.interest],
        [f.spentLabel, f.spent]
      ].map(function (r) { return '<div><dt>' + esc(r[0]) + '</dt><dd>' + won(r[1]) + '</dd></div>'; }).join('');
      return '<section class="fund">' +
        '<p class="fund-label">' + esc(f.balanceLabel) + '</p>' +
        '<p class="fund-big num">' + won(f.balance) + '<i>원</i></p>' +
        '<p class="fund-sub">' + t.y + '년 ' + t.m + '월 ' + t.d + '일 거래 기준</p>' +
        '<dl class="flow">' + rows +
        '<div class="flow-total"><dt>' + (Y.year >= ymd(D.asOf).y ? '지금 잔액' : '남은 잔액') + '</dt><dd>' + won(f.balance) + '</dd></div></dl>' +
        (Y.bank.partial ? '<p class="warn">통장 자료가 ' + md(Y.bank.start) + '부터예요. 그 앞의 입금·지출이 빠져 있어요.</p>' : '') +
        '</section>';
    }

    /* ---------- 미납 ---------- */
    function unpaidHtml(Y) {
      var owing = Y.members.filter(function (m) { return m.owedAmount > 0; })
        .sort(function (a, b) { return b.owedAmount - a.owedAmount; });
      var total = owing.reduce(function (s, m) { return s + m.owedAmount; }, 0);
      var body;
      if (!owing.length) {
        body = '<div class="cards"><p class="allclear">미납이 없어요.</p></div>';
      } else {
        body = '<ul class="cards">' + owing.map(function (m) {
          var parts = [];
          var over = m.months.filter(function (x) { return x.status === 'overdue'; }).map(function (x) { return x.m; });
          if (over.length) parts.push(Y.year + '년 ' + ranges(over));
          var byY = {};
          m.carry.forEach(function (c) { (byY[c.y] = byY[c.y] || []).push(c.m); });
          Object.keys(byY).sort().forEach(function (y) { parts.push(y + '년 ' + ranges(byY[y])); });
          var checked = m.months.filter(function (x) { return x.status === 'overdue'; }).concat(m.carry)
            .map(function (x) { return x.bank; });
          var ev = checked.length && checked.every(function (v) { return v === true; })
            ? '<div class="u-ev">통장에도 입금이 없어요</div>' : '';
          return '<li class="u-row"><div class="u-main"><span class="u-name">' + esc(m.name) + '</span> ' +
            (m.annual.length ? '<span class="chip">연납 회원</span>' : '') +
            '<div class="u-detail">' + parts.join(' · ') + ' <span class="num">(' + m.owedCount + '개월)</span></div>' +
            ev + '</div><div class="u-amt num">' + won(m.owedAmount) + '원</div></li>';
        }).join('') + '</ul>';
      }
      var due = Y.members.filter(function (m) { return m.dueThisMonth; }).map(function (m) { return m.name; });
      var note = due.length ? '<p class="note">' + Y.curMonth + '월분은 30일까지예요. 아직 안 낸 회원: ' +
        due.map(esc).join(' · ') + '</p>' : '';
      return '<section><div class="sec-head"><h2>미납</h2><span class="sec-sum">' +
        (owing.length ? owing.length + '명 · ' + won(total) + '원' : '없어요') +
        '</span></div>' + body + note + '</section>';
    }

    /* ---------- 회원별 ---------- */
    function memberDetail(Y, m) {
      var cells = m.months.map(function (x) {
        var v, cls = '';
        if (x.status === 'paid') {
          v = x.date ? md(x.date) + ' 납부' : esc(x.text);
          if (x.late > 0) v += ' <span class="md-late">' + x.late + '달 늦게</span>';
        } else if (x.status === 'overdue') { v = '미납'; cls = 'md-over'; }
        else if (x.status === 'due') { v = '30일까지'; cls = 'md-due'; }
        else { v = '—'; cls = 'md-up'; }
        return '<div><dt>' + x.m + '월</dt><dd class="' + cls + '">' + v + '</dd></div>';
      }).join('');
      var html = '<div class="m-detail"><dl class="md-grid">' + cells + '</dl>';
      var byY = {};
      m.carry.forEach(function (c) { (byY[c.y] = byY[c.y] || []).push(c.m); });
      Object.keys(byY).sort().forEach(function (y) {
        var checked = m.carry.filter(function (c) { return String(c.y) === String(y); }).map(function (c) { return c.bank; });
        var ev = checked.every(function (v) { return v === true; }) ? ' <span class="ev">· 통장에도 입금이 없어요</span>' : '';
        html += '<p class="md-note">' + y + '년 미납: ' + ranges(byY[y]) + ' · ' +
          won(byY[y].length * m.fee) + '원' + ev + '</p>';
      });
      if (m.annual.length) {
        html += '<p class="md-note">보통 1년치를 한 번에 내요 · ' + m.annual.map(function (d) {
          var t = ymd(d); return t.y + '.' + t.m + '.' + t.d;
        }).join(' · ') + '</p>';
      }
      if (m.prevMonths.length && !byYear[m.prevYear]) {
        html += '<p class="md-sub">' + m.prevYear + '년 기록</p>' + strip(m.prevMonths, true);
      }
      return html + '</div>';
    }
    function membersHtml(Y) {
      var list = Y.members.map(function (m) {
        var pill = m.owedAmount > 0
          ? '<span class="pill p-over">' + m.owedCount + '개월 미납</span>'
          : m.dueThisMonth ? '<span class="pill p-due">' + Y.curMonth + '월분 대기</span>'
            : '<span class="pill p-ok">완납</span>';
        var chips = '';
        if (m.role) chips += '<span class="chip-mute chip">' + esc(m.role) + ' · 월 ' + (m.fee / 10000) + '만원</span>';
        if (m.annual.length) chips += ' <span class="chip">연납</span>';
        return '<details class="m" data-name="' + esc(m.name) + '"><summary>' +
          '<div class="m-top"><span class="m-name">' + esc(m.name) + '</span>' + chips + pill + '<span class="chev"></span></div>' +
          strip(m.months) +
          '<div class="m-amt"><span>납부금액 <b class="num">' + won(m.paidAmount) + '원</b></span>' +
          '<span class="owe">미납금액 <b class="num">' + won(m.owedAmount) + '원</b></span></div>' +
          '</summary>' + memberDetail(Y, m) + '</details>';
      }).join('');
      return '<section><div class="sec-head"><h2>회원별 납부</h2><span class="sec-sum">' + Y.year + '년</span></div>' +
        '<div class="picker"><label for="mine">내 이름</label><select id="mine"><option value="">고르기</option>' +
        Y.members.map(function (m) { return '<option>' + esc(m.name) + '</option>'; }).join('') + '</select></div>' +
        '<div class="legend">' +
        '<span><i class="sw sw-paid"></i>납부</span><span><i class="sw sw-over"></i>미납</span>' +
        '<span><i class="sw sw-due"></i>이번 달</span><span><i class="sw sw-up"></i>아직</span></div>' +
        '<div class="cards" id="mlist">' + list + '</div></section>';
    }

    /* ---------- 지출 ---------- */
    function expensesHtml(Y) {
      var groups = [], byKey = {};
      Y.expenses.forEach(function (e) {
        var key = e.cat === '상조회비' ? '상조회비' : (e.event || ('#' + groups.length));
        if (!byKey[key]) {
          byKey[key] = {
            key: key, cat: e.cat, date: e.date, amount: 0, items: [],
            title: key === '상조회비' ? '상조회비 (프리드라이프)' : (e.event || e.title)
          };
          groups.push(byKey[key]);
        }
        var g = byKey[key];
        g.amount += e.amount;
        g.items.push(e);
        if (e.date > g.date) g.date = e.date;
      });
      groups.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      var total = Y.expenses.reduce(function (s, e) { return s + e.amount; }, 0);
      if (!total) {
        return '<section><div class="sec-head"><h2>지출</h2><span class="sec-sum">' + Y.year + '년</span></div>' +
          '<div class="cards"><p class="allclear">기록된 지출이 없어요.</p></div></section>';
      }
      var byCat = {};
      Y.expenses.forEach(function (e) { byCat[e.cat] = (byCat[e.cat] || 0) + e.amount; });
      var cats = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; });
      var bar = '<div class="bar">' + cats.map(function (c) {
        return '<i style="width:' + (byCat[c] / total * 100).toFixed(1) + '%;background:' + (CAT_COLORS[c] || 'var(--cat-6)') + '"></i>';
      }).join('') + '</div><div class="bar-legend">' + cats.map(function (c) {
        return '<span><i class="dot" style="background:' + (CAT_COLORS[c] || 'var(--cat-6)') + '"></i>' + esc(c) + ' ' + won(byCat[c]) + '원</span>';
      }).join('') + '</div>';
      var rows = groups.map(function (g) {
        var t = ymd(g.date);
        var date = (t.m < 10 ? '0' : '') + t.m + '.' + (t.d < 10 ? '0' : '') + t.d;
        var allCash = g.items.every(function (e) { return e.cash; });
        var title = esc(g.title || g.cat || '내용 확인 중') +
          (g.items.length > 1 ? ' <small>' + g.items.length + '건</small>' : '') +
          (allCash ? ' <small>현금</small>' : '');
        var head = '<div class="e-row"><span class="e-date">' + date + '</span>' +
          '<span class="e-title">' + title + '</span>' +
          '<span class="e-amt num">' + won(g.amount) + '원</span></div>';
        if (g.items.length < 2) return '<li>' + head + '</li>';
        var items = g.items.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).map(function (e) {
          var d = ymd(e.date);
          return '<div class="e-item"><span>' + d.m + '/' + d.d + ' ' + esc(e.title || e.cat) + '</span><span>' + won(e.amount) + '원</span></div>';
        }).join('');
        return '<li><details class="e"><summary>' + head + '</summary><div class="e-items">' + items + '</div></details></li>';
      }).join('');
      return '<section><div class="sec-head"><h2>지출</h2><span class="sec-sum">' + Y.year + '년</span></div>' +
        bar + '<ul class="cards">' + rows +
        '<li class="e-total"><span>' + (Y.year >= ymd(D.asOf).y ? '올해' : Y.year + '년') + ' 쓴 돈' +
        (Y.fund.cash ? ' <small>통장 ' + won(Y.fund.spent) + ' · 현금 ' + won(Y.fund.cash) + '</small>' : '') +
        '</span><span class="num">' + won(total) + '원</span></li></ul>' +
        '<p class="note">모임 지원비는 총무 계좌로 옮긴 뒤 모임에서 썼어요.</p></section>';
    }

    /* ---------- 정산 ---------- */
    function catTotals(Y) {
      var by = {};
      Y.expenses.forEach(function (e) { by[e.cat] = (by[e.cat] || 0) + e.amount; });
      return by;
    }
    function memberLine(Y, m) {
      if (m.owedAmount > 0) { return m.owedCount + '개월 미납 ' + won(m.owedAmount) + '원'; }
      if (m.dueThisMonth) { return Y.curMonth + '월분 대기'; }
      return '완납';
    }
    function settlementHtml(Y) {
      var f = Y.fund, t = ymd(Y.bank.lastTxn), by = catTotals(Y);
      var closed = Y.year < ymd(D.asOf).y;
      var rows = [
        [f.openingLabel.replace(/^\+ /, ''), f.opening],
        ['걷은 계비', f.dues],
        ['예금 이자', f.interest],
        ['쓴 돈', -f.spent],
        [closed ? '연말 잔액' : '지금 잔액', f.balance]
      ];
      var table = '<ul class="cards set-flow">' + rows.map(function (r, i) {
        return '<li class="set-row' + (i === rows.length - 1 ? ' set-total' : '') + '">' +
          '<span>' + esc(r[0]) + '</span><span class="num">' + won(r[1]) + '원</span></li>';
      }).join('') + '</ul>';

      var people = '<ul class="cards">' + Y.members.map(function (m) {
        var line = memberLine(Y, m);
        var cls = m.owedAmount > 0 ? 'set-owe' : m.dueThisMonth ? 'set-due' : 'set-ok';
        return '<li class="set-row"><span>' + esc(m.name) + '</span>' +
          '<span class="' + cls + '">' + line + '</span></li>';
      }).join('') + '</ul>';

      var spend = '<ul class="cards">' + Object.keys(by).sort(function (a, b) { return by[b] - by[a]; })
        .map(function (c) {
          return '<li class="set-row"><span>' + esc(c) + '</span><span class="num">' + won(by[c]) + '원</span></li>';
        }).join('') + '</ul>';

      var sangjo = '';
      if (Y.sangjo) {
        sangjo = '<p class="note">상조보험(프리드라이프) <b>' + Y.sangjo.count + '회차</b> 납입 중 · ' +
          '누적 ' + won(Y.sangjo.total) + '원 <span class="md-late">(회당 ' + won(Y.sangjo.each) + '원 기준)</span></p>';
      }
      return '<section id="settle"><div class="sec-head"><h2>' + Y.year + '년 정산</h2>' +
        '<span class="sec-sum">' + (closed ? '결산' : t.m + '/' + t.d + '까지') + '</span></div>' +
        '<p class="set-label">돈의 흐름</p>' + table +
        '<p class="set-label">회원별</p>' + people +
        '<p class="set-label">어디에 썼나</p>' + spend + sangjo +
        '<button class="copy" id="setcopy" type="button">정산 문구 복사</button>' +
        '</section>';
    }
    function settlementText(Y) {
      var f = Y.fund, t = ymd(Y.bank.lastTxn), by = catTotals(Y);
      var closed = Y.year < ymd(D.asOf).y;
      var lines = ['[' + D.club + ' ' + Y.year + '년 계비 정산] ' +
        (closed ? '결산' : t.m + '/' + t.d + ' 기준'), '', '■ 회원별'];
      Y.members.forEach(function (m) { lines.push('- ' + m.name + ' ' + memberLine(Y, m)); });
      lines.push('', '■ 돈의 흐름');
      lines.push('- ' + f.openingLabel.replace(/^\+ /, '') + ' ' + won(f.opening) + '원');
      lines.push('- 걷은 계비 ' + won(f.dues) + '원 / 이자 ' + won(f.interest) + '원');
      lines.push('- 쓴 돈 ' + won(f.spent) + '원');
      Object.keys(by).sort(function (a, b) { return by[b] - by[a]; }).forEach(function (c) {
        lines.push('   · ' + c + ' ' + won(by[c]) + '원');
      });
      lines.push('', '■ ' + (closed ? Y.year + '년 말 남은 계비 ' : '남은 계비 ') + won(f.balance) + '원');
      if (Y.sangjo) {
        lines.push('■ 상조보험 ' + Y.sangjo.count + '회차 납입 중 (' + won(Y.sangjo.total) + '원)');
      }
      lines.push('', '자세히: ' + (D.url || location.href));
      return lines.join('\n');
    }

    /* ---------- 맨 아래 ---------- */
    function footHtml(Y) {
      var changes = Y.changes.length ? '<div class="changes"><p>지난번 이후 달라진 점</p><ul>' +
        Y.changes.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>' : '';
      return '<div class="foot">' + changes +
        '<button class="copy" id="copy" type="button">카톡에 올릴 공지 문구 복사</button>' +
        '<p>계비는 월 ' + won(D.fee) + '원, 매월 30일까지 내요 (계칙 제22조).</p>' +
        '<p>장부는 늦게 낸 돈을 밀린 달부터 채워요. 그래서 낸 날짜가 그 달보다 뒤일 수 있어요.</p>' +
        '<p>자료: ' + D.years.map(function (y) { return y.year; }).sort().join('년 / ') + '년 통장 거래내역</p>' +
        '<p>궁금한 점은 총무에게 물어봐 주세요.</p></div>';
    }

    function noticeText(Y) {
      var f = Y.fund, t = ymd(Y.bank.lastTxn);
      var owing = Y.members.filter(function (m) { return m.owedAmount > 0; })
        .sort(function (a, b) { return b.owedAmount - a.owedAmount; });
      var due = Y.members.filter(function (m) { return m.dueThisMonth; }).map(function (m) { return m.name; });
      var lines = ['[' + D.club + ' 계비 현황] ' + Y.year + '년 · ' + t.m + '/' + t.d + ' 기준',
      '통장 잔액 ' + won(f.balance) + '원',
      '계비 ' + won(f.dues) + '원 · 지출 ' + won(f.spent) + '원'];
      lines.push(owing.length
        ? '미납 ' + owing.length + '명 ' + won(owing.reduce(function (s, m) { return s + m.owedAmount; }, 0)) + '원 — ' +
        owing.map(function (m) { return m.name + ' ' + won(m.owedAmount); }).join(', ')
        : '미납 없음');
      if (due.length) lines.push(Y.curMonth + '월분(30일까지) 아직: ' + due.join('·'));
      lines.push('자세히: ' + (D.url || location.href));
      return lines.join('\n');
    }

    /* ---------- 그리기 ---------- */
    var app = document.getElementById('app'), tabs = document.getElementById('years');

    function savedName() { try { return localStorage.getItem('gye-me') || ''; } catch (e) { return ''; } }
    function pin(name) {
      var list = document.getElementById('mlist');
      if (!list) return;
      Array.prototype.forEach.call(list.children, function (el) { el.classList.remove('mine'); });
      if (!name) return;
      var el = list.querySelector('[data-name="' + name.replace(/"/g, '') + '"]');
      if (!el) return;
      el.classList.add('mine');
      list.insertBefore(el, list.firstChild);
    }

    function draw() {
      var Y = byYear[curYear];
      curYear = Y.year;
      app.innerHTML = fundHtml(Y) + unpaidHtml(Y) + membersHtml(Y) + expensesHtml(Y) +
        settlementHtml(Y) + footHtml(Y);
      Array.prototype.forEach.call(tabs.children, function (b) {
        b.setAttribute('aria-current', String(Number(b.dataset.year) === curYear));
      });

      var sel = document.getElementById('mine'), me = savedName();
      if (me) { sel.value = me; pin(me); }
      sel.addEventListener('change', function () {
        pin(sel.value);
        try { localStorage.setItem('gye-me', sel.value); } catch (e) { }
      });

      wireCopy(document.getElementById('copy'), function () { return noticeText(Y); },
        '카톡에 올릴 공지 문구 복사');
      wireCopy(document.getElementById('setcopy'), function () { return settlementText(Y); },
        '정산 문구 복사');
    }

    function wireCopy(btn, getText, label) {
      if (!btn) { return; }
      btn.addEventListener('click', function () {
        var text = getText();
        var done = function () {
          btn.textContent = '복사했어요';
          setTimeout(function () { btn.textContent = label; }, 2000);
        };
        function fallback() {
          var ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          if (ok) { done(); } else { btn.textContent = '복사가 안 돼요. 화면을 길게 눌러 복사해 주세요'; }
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, fallback);
        } else { fallback(); }
      });
    }

    function boot(data) {
      D = data;
      D.years.forEach(function (y) { byYear[y.year] = y; });
      curYear = D.defaultYear;
      var a = ymd(D.asOf);
      document.getElementById('eyebrow').textContent = D.club;
      document.getElementById('sub').textContent = a.y + '년 ' + a.m + '월 ' + a.d +
        '일 기준 · 계장부와 통장 거래내역으로 정리했어요';
      if (D.years.length > 1) {
        tabs.hidden = false;
        tabs.innerHTML = D.years.slice().sort(function (x, y) { return y.year - x.year; }).map(function (y) {
          return '<button type="button" data-year="' + y.year + '">' + y.year + '년</button>';
        }).join('');
        tabs.addEventListener('click', function (e) {
          var b = e.target.closest('button[data-year]');
          if (!b) return;
          curYear = Number(b.dataset.year);
          draw();
          window.scrollTo({ top: 0, behavior: 'auto' });
        });
      }
      draw();
    }

    /* ---------- 비밀번호 잠금 ---------- */
    function b64(s) {
      var bin = atob(s), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) { out[i] = bin.charCodeAt(i); }
      return out;
    }
    function b64enc(buf) {
      var b = new Uint8Array(buf), out = '';
      for (var i = 0; i < b.length; i++) { out += String.fromCharCode(b[i]); }
      return btoa(out);
    }
    function subtleOrNull() { return (window.crypto && window.crypto.subtle) || null; }
    function keyFromPassword(enc, pw) {
      var subtle = subtleOrNull();
      if (!subtle) { return Promise.reject(new Error('insecure')); }
      return subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
        .then(function (km) {
          return subtle.deriveKey({ name: 'PBKDF2', salt: b64(enc.salt), iterations: enc.iter, hash: 'SHA-256' },
            km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
        });
    }
    function decryptWith(enc, key) {
      var subtle = subtleOrNull();
      if (!subtle) { return Promise.reject(new Error('insecure')); }
      return subtle.decrypt({ name: 'AES-GCM', iv: b64(enc.iv) }, key, b64(enc.ct)).then(function (plain) {
        return JSON.parse(new TextDecoder().decode(plain));
      });
    }
    function lockScreen(enc) {
      var form = document.getElementById('lock'), pw = document.getElementById('pw');
      var err = document.getElementById('lockerr'), remember = document.getElementById('remember');
      var saved = '';
      try { saved = localStorage.getItem('gye-key') || ''; } catch (e) { }

      function fail(e, silent) {
        try { localStorage.removeItem('gye-key'); } catch (x) { }
        form.hidden = false;
        if (silent) { pw.focus(); return; }
        err.hidden = false;
        err.textContent = e && e.message === 'insecure'
          ? '이 주소에서는 비밀번호를 풀 수 없어요. https 주소로 열어 주세요.'
          : '비밀번호가 달라요. 다시 넣어 주세요.';
        pw.value = '';
        pw.focus();
      }
      function show(data) { form.hidden = true; boot(data); }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        err.hidden = true;
        keyFromPassword(enc, pw.value).then(function (key) {
          return decryptWith(enc, key).then(function (data) {
            if (remember.checked) {   // 비밀번호가 아니라 복호화 키만 남긴다
              subtleOrNull().exportKey('raw', key).then(function (raw) {
                try { localStorage.setItem('gye-key', b64enc(raw)); } catch (x) { }
              }, function () { });
            }
            show(data);
          });
        }, function (e2) { fail(e2, false); }).catch(function (e3) { fail(e3, false); });
      });

      if (saved) {
        var subtle = subtleOrNull();
        if (!subtle) { fail(new Error('insecure'), false); return; }
        subtle.importKey('raw', b64(saved), { name: 'AES-GCM' }, false, ['decrypt'])
          .then(function (key) { return decryptWith(enc, key).then(show); })
          .catch(function (e4) { fail(e4, true); });
      } else { form.hidden = false; pw.focus(); }
    }

    if (RAW.enc) { lockScreen(RAW.enc); } else { boot(RAW); }
  })();
</script>
</body></html>
